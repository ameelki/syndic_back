spring.application.name=syndic
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://localhost:5432/TEST
spring.datasource.username=postgres
spring.datasource.password=Tunis19971920@
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create

# ===== JWT : secret d'au moins 32 caractères =====
app.jwt.secret=${JWT_SECRET:CHANGE_ME_with_a_very_long_random_secret_key_32chars_min}
app.jwt.expiration-ms=86400000

# ===== Compte syndic (administrateur) créé au premier démarrage =====
app.admin.email=aymen@gmail.com
app.admin.password=changeme123

# ===== Agences : agence par défaut (créée au démarrage) et super administrateur de la plateforme =====
app.agency.default-slug=default
app.agency.default-name=Syndic
app.super.email=${SUPER_EMAIL:super@syndic.lu}
app.super.password=${SUPER_PASSWORD:changeme123}

# ===== CORS (adresses du front, séparées par des virgules) =====
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ===== Fichiers (photos de signalement, documents) =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ===== Emails =====
# Sans serveur SMTP, les emails sont seulement écrits dans les logs. Pour les activer, définir les variables d'environnement
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD (ex. Brevo : smtp-relay.brevo.com, 587).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@syndic.lu}
# Adresse publique du front (liens dans les emails)
app.front-url=${FRONT_URL:http://localhost:4200}
# Relances automatiques des charges en retard (1 fois par jour à 8h, 3 relances maximum, 14 jours entre deux)
app.reminders.enabled=${REMINDERS_ENABLED:false}
